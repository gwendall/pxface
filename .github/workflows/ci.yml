name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "fonttools[woff]"
      - run: npm ci
      - run: npm audit
      - run: npm test
      - run: npm run lint
      - run: npm run package:verify
      - run: npm run font:verify
      - run: npm run build
